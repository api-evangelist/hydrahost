aid: hydrahost
name: Hydrahost
description: >-
  Hydra Host is a bare-metal GPU cloud provider that rents and sells dedicated
  NVIDIA GPU servers (B200, H200, RTX 4090 and more) with full root access across
  40+ global data centers for AI training, inference, developer platforms, and
  neocloud infrastructure. Its Brokkr platform — marketed as the "AI Factory
  Operating System" — exposes a single REST API (base
  https://brokkr.hydrahost.com/api/v1) to provision, terminate, and manage GPU
  fleets programmatically across every data center and OEM hardware stack (Quanta,
  Lenovo, HPE, NVIDIA), with real-time inventory, interruptible/on-demand/reserved
  contract terms, and single-tenant, encrypted "Confidential Metal" compute.
